# 개발(dev) 프로필 설정입니다. application.yaml의 spring.profiles.active: dev 때문에 기본으로 적용됩니다.
spring:
  h2:
    console:
      enabled: true   # http://localhost:8080/h2-console 에서 DB를 웹으로 들여다볼 수 있다.
  datasource:
    # 파일 DB: 프로젝트 폴더에 db_dev.mv.db 파일이 생기고, 앱을 재시작해도 데이터가 남는다.
    # MODE=MySQL: H2가 MySQL 문법/동작을 흉내 낸다(나중에 MySQL로 옮기기 쉽게).
    url: jdbc:h2:./db_dev;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
